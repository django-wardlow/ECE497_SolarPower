<!DOCTYPE html>
<html>
  <head>
    <title>ECE497 power supply dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="uPlot.min.css">
    <script src="uPlot.iife.js"></script>
  </head>
  <body>
    <div class="topnav">
      <h1>power supply dashboard</h1>

    </div>

    <div class="run-info">
      <div class="out-info">
        <p>Output:</p>
        <p id="Vout">0.0 V</p>
        <p id="Iout">0.0 A</p>
        <p id="Pout">0.0 W</p>

      </div>

      <div class="stat-info">
        <p>Metrics:</p>
        <p id="Vin">0.0 V</p>
        <p id="Efficiency">0.0 η</p>
        <p id="Duty">0.0 %</p>

      </div>

      <div class="race-actions">
        <p>Settings:</p>
          <div class="user_floats">

            <div class="userinputbox", id="set_v">
              <label for="Vout_set", name="output v">Output V</label>
              <input type="number", id="V", placeholder="0", step="0.01", onchange="value_changed(this)">
            </div> 

            <div class="userinputbox">
              <label for="Iout_set", name="output v">Output I</label>
              <input type="number", id="I", placeholder="0", step="0.01", onchange="value_changed(this)">
            </div> 

            <div class="userinputbox">
              <label for="F_set", name="output v">Freq kHz</label>
              <input type="number", id="F", placeholder="100", step="1", onchange="value_changed(this)">
            </div> 

            <div class="userinputbox">
              <label for="D_set", name="output v">dead time us</label>
              <input type="number", id="D", placeholder="20", step="1", onchange="value_changed(this)">
            </div> 


          </div>
      </div>
      

    </div>


    <div class="content">
      
      <button onclick="clear_graph()">clear graph</button>
      
      <label class="switch">
        <input type="checkbox" id="run-graph" checked>
        <span class="slider"></span>
      </label>

      <div id="chart-data" class="chart-container"></div>

    </div>
    <!-- source for the javascript that handles updates from the esp32 -->
    <script src="script.js"></script>

  </body>
</html>

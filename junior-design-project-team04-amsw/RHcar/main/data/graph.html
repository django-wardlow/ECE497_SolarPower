<!DOCTYPE html>
<html>
  <head>
    <title>RHcar dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="uPlot.min.css">
    <script src="uPlot.iife.js"></script>
  </head>
  <body>
    <div class="topnav">
      <h1>RHcar data</h1>
    </div>

    <button onclick="clear_graph()">clear graph</button>
    
    <label class="switch">
      <input type="checkbox" id="run-graph" checked>
      <span class="slider"></span>
    </label>


    <div id="chart-data" class="chart-container"></div>


    <!-- source for the javascript that handles updates from the esp32 -->
    <script src="script_graph.js"></script>
  </body>
</html>

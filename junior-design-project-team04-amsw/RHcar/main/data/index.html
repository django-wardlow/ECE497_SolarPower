<!-- 
Author: Django Wardlow

The webpage that is served for the Rose-Hulman car dashboard

Values are populated by the javascript that receives data from the car

-->

<!DOCTYPE html>
<html>
  <head>
    <title>RHcar dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <div class="topnav">
      <h1>RHcar dashboard</h1>

      <a target="_blank" rel="noopener noreferrer" class="button" href="http://192.168.4.1/graph.html">Open graph</a>

    </div>

    <div class="run-info">
      <div class="bat-info">
        <p>Power:</p>
        <p id="voltage">0.0 V</p>
        <p id="current">0.0 mA</p>
        <p id="watts">0.0 mW</p>
        <p id="available">0.0 J</p>

      </div>

      <div class="race-info">
        <p>Race info:</p>
        <p id="timer">0 S</p>
        <!-- <p id="race-phase">Stop</p> -->
        <p id="race-energy">0.0 J used</p>
        <p id="charge-energy">0.0 J charged</p>

      </div>

      <div class="race-actions">
        <p>Race Actions:</p>
        <button id="race-start" onclick="start_race_btn()">start</button>
        <button id="race-charge" onclick="manual_charge_btn()">charge</button>
        <button id="race-stop" onclick="stop_race_btn()">stop</button>
      </div>
      

    </div>


    <div class="content">
      
      <div class="card-grid">
        <div class="card">
          <p class="card-title">Log</p>

          <!-- log message container, initially empty -->
          <div style="height:400px; border:1px solid #ccc;font:16px/26px 'Courier New', monospace;overflow:auto;" id="text-container"></div>

        </div>
        <div class="card">
          <p class="card-title">user vars</p>

          <div class="user_ints", id="u_ints">


            
          </div>

          <div class="user_floats", id="u_floats">


            
          </div>

        </div>
      </div>
    </div>
    <!-- source for the javascript that handles updates from the esp32 -->
    <script src="script.js"></script>
  </body>
</html>
